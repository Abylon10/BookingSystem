// proto/booking.proto — [PDC: RPC] [PDC: Marshalling]
//
// The gRPC contract between central and the islands (LAN / hotspot mode).
// gRPC marshals these messages as protobuf binary on the wire; the JSON
// inside Invocation.json is marshalled by shared/marshal.ts.
//
// Over the internet the same calls travel on the WebSocket island link or
// HTTPS polling instead (shared/link.ts, central/poll.ts) with the SAME
// method names, bodies and error codes, so one set of handlers on the island
// (island/server.ts, the `api` map) serves all three transports.

syntax = "proto3";

package biliran.booking.v1;

// Served by every island node. Central is the client.
service IslandService {
  // Every island method travels as Invoke(method name + JSON body):
  //   SearchAvailability  packages and services free for a day (search fan-out)
  //   PackageCalendar     day-by-day availability of one package
  //   Quote               price and dates without booking
  //   HoldBooking         saga step 1: reserve units atomically -> HELD
  //   ConfirmBooking      saga step 2: HELD -> CONFIRMED after payment
  //   ReleaseHold         saga compensation: payment failed -> units back
  //   CancelBooking       cancel and compute the refund
  //   GetBooking          lookup by reference + e-mail
  //   GetCatalog, GetRecords, GetInventory, CreateStaff, ListStaff,
  //   SetStaffActive, Ping
  // One small, stable message keeps the contract the same while methods are
  // added; errors come back as "CODE: message" in the gRPC status details.
  rpc Invoke(Invocation) returns (Invocation);
}

// Served by central. Islands are the clients.
service CentralService {
  // Island outbox -> central (replication). Events are de-duplicated by
  // event_id, so sending the same batch twice is harmless.
  rpc PushEvents(EventBatch) returns (EventAck);
}

// Generic call: method name and its JSON request (or JSON reply).
message Invocation {
  string method = 1;
  string json = 2;
}

// One change made on an island (written to its outbox in the same
// transaction as the change itself).
message Event {
  string event_id = 1;      // uuid, unique per event
  string island_id = 2;
  string type = 3;          // "BOOKING_UPDATED" | "CATALOG_CHANGED" | ...
  string booking_id = 4;
  string payload_json = 5;  // the changed record, marshalled as JSON
  int64 created_at_ms = 6;
}
message EventBatch {
  repeated Event events = 1;
}
message EventAck {
  repeated string accepted_event_ids = 1;
}
